name: Convert seasonal music to Vorbis

on:
  push:
    branches: [main]
    paths:
      - "assets/seasonal_music.ogg"
      - ".github/workflows/convert-seasonal-music.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[vorbis-converted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check codec
        id: codec
        shell: bash
        run: |
          CODEC="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 assets/seasonal_music.ogg)"
          echo "codec=$CODEC" >> "$GITHUB_OUTPUT"
          echo "Current codec: $CODEC"

      - name: Convert to Ogg Vorbis
        if: steps.codec.outputs.codec != 'vorbis'
        shell: bash
        run: |
          ffmpeg -y -i assets/seasonal_music.ogg -c:a libvorbis -q:a 5 -ar 44100 -ac 2 assets/seasonal_music.converted.ogg
          mv assets/seasonal_music.converted.ogg assets/seasonal_music.ogg
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 assets/seasonal_music.ogg

      - name: Commit converted audio
        if: steps.codec.outputs.codec != 'vorbis'
        shell: bash
        run: |
          git config user.name "Pocket Meadows Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/seasonal_music.ogg
          git commit -m "Convert seasonal music to Vorbis [vorbis-converted]"
          git push

# Triggered after workflow creation
